<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #header
        {
            
             border: rgb(13, 17, 17) solid 5px;
            background-color: rgb(144, 164, 165);
        }
        .header3
        {
            border: rgb(214, 165, 91) solid 3px;
            
           
        }
         .card
        {
            border: 3px solid rgb(17, 8, 8);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 5px;
            background-color: #eaf4fc;
            width: 450px;

        }
        
        #nav ul
    {
        nav ul a
        {
            display: inline-block;
        }
    }
        
    </style>
</head>
<body>
   

    <div id="header">
        <h1 align="center">
          STUDENTHUB 
        </h1>
       
    </div>
    <br></br>
     <br></br>

    <div align="center">
   <form action="home.HTML" method="get" align="center" class="card">
    <br></br>
    <u><h3>Student Login</h3></u>

         <br></br>
        <br></br>


    <table>

         Name : <input type="text"
       name="username"
       placeholder="Enter your name"
       pattern="[A-Za-z ]+"
       title="Only alphabets are allowed"
       required>
       <br></br>


       Email : <input type="email" placeholder="enter your email" required>
       <br></br>
          

        <label>Password : </label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required
               minlength="8">
        <br><br>
        <br><br>
        

        <input type="submit" value="signup" style="width: 250px;">
        </div>
        </form>
        
        <br></br>
                <br></br>
        <br></br>
        
        

       <div align="left"><a href="login.HTML"><button type="button">BACK</button></a></div>
   
   
</body>
</html>
