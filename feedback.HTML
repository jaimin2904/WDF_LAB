
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="header">
        <h1 align="center">STUDENTHUB</h1>
    </div>

    <br>

    <div align="center">
        <a href="home.HTML"><button type="button">Home</button></a>
        <a href="profile.HTML"><button type="button">Profile</button></a>
        <a href="events.HTML"><button type="button">Events</button></a>
        <a href="Attendance.HTML"><button type="button">Attendance</button></a>
        <a href="result.HTML"><button type="button">Result</button></a>
        <a href="timetable.html"><button type="button">TimeTable</button></a>
        <a href="feedback.HTML"><button type="button">FeedBack</button></a>
    </div>

    <br>
    <hr>
    <br>

    <div align="center">

        <form id="feedbackForm" class="card">

            <h2 align="center"><u>STUDENT FEEDBACK</u></h2>

            <br>

            <table class="form-table" align="center">

                <tr>
                    <td>
                        <label for="fullname">Full Name :</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            
                        >
                        <small id="fullnameError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="enrollment">Enrollment No. :</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="enrollment"
                            name="enrollment"
                            placeholder="e.g. 25CE047"
                            
                        >
                        <small id="enrollmentError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="email">Email :</label>
                    </td>
                    <td>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="abc@gmail.com"
                            
                        >
                        <small id="emailError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="department">Department :</label>
                    </td>
                    <td>
                        <input
                            type="text"
                            id="department"
                            name="department"
                            placeholder="e.g. CE-CSPIT"
                            
                        >
                        <small id="departmentError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="semester">Semester :</label>
                    </td>
                    <td>
                        <select id="semester" name="semester" >
                            <option value="">Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                        <small id="semesterError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="feedback_type">Feedback Type :</label>
                    </td>
                    <td>
                        <select id="feedback_type" name="feedback_type" >
                            <option value="">Select Type</option>
                            <option value="suggestion">Suggestion</option>
                            <option value="bug">Bug Report</option>
                            <option value="complaint">Complaint</option>
                            <option value="other">Other</option>
                        </select>
                        <small id="feedbackTypeError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="rating">Rate StudentHub :</label>
                    </td>
                    <td>
                        <select id="rating" name="rating" >
                            <option value="">Select Rating</option>
                            <option value="5">★ ★ ★ ★ ★</option>
                            <option value="4">★ ★ ★ ★ ☆</option>
                            <option value="3">★ ★ ★ ☆ ☆</option>
                            <option value="2">★ ★ ☆ ☆ ☆</option>
                            <option value="1">★ ☆ ☆ ☆ ☆</option>
                        </select>
                        <small id="ratingError"></small>
                    </td>
                </tr>

                <tr>
                    <td valign="top">
                        Recommend Website? :
                    </td>
                    <td>
                        <input
                            type="radio"
                            name="recommend"
                            value="yes"
                            id="rec_yes"
                            
                        >
                        <label for="rec_yes">Yes</label>

                        <br>

                        <input
                            type="radio"
                            name="recommend"
                            value="no"
                            id="rec_no"
                        >
                        <label for="rec_no">No</label>

                        <br>

                        <input
                            type="radio"
                            name="recommend"
                            value="maybe"
                            id="rec_maybe"
                        >
                        <label for="rec_maybe">Maybe</label>

                        <small id="recommendError"></small>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <label for="feedback_content">Your Feedback :</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <textarea
                            id="feedback_content"
                            name="feedback_content"
                            rows="6"
                            cols="55"
                            placeholder="Write your thoughts here..."
                            
                        ></textarea>

                        <small id="feedbackError"></small>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="screenshot">Upload Screenshot :</label>
                    </td>
                    <td>
                        <input
                            type="file"
                            id="screenshot"
                            name="screenshot"
                            accept="image/*"
                        >
                    </td>
                </tr>

            </table>

            <br><br>

            <div align="center">
                <button type="submit">Submit Feedback</button>
                <button type="reset">Reset</button>
            </div>

            <br>

        </form>

        <br>

        <a href="home.HTML">
            <button type="button">BACK</button>
        </a>

        <br><br>

    </div>

    <hr>

    <footer align="center">
        <h4>@ 2026 Jaimin Khambhaliya</h4>
    </footer>

    <script src="feedback.js"></script>

</body>
</html>
