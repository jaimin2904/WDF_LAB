    <div align="center">

        <form action="practical7_process.php" method="POST" class="card" id="contactForm">

            <h2 align="center"><u>Contact / Registration Form (Practical 7)</u></h2>

            <br>

            <table class="form-table" align="center">

                <tr>
                    <td><label for="fullname">Full Name :</label></td>
                    <td>
                        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email :</label></td>
                    <td>
                        <input type="email" id="email" name="email" placeholder="abc@gmail.com">
                    </td>
                </tr>

                <tr>
                    <td><label for="phone">Phone :</label></td>
                    <td>
                        <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number">
                    </td>
                </tr>

                <tr>
                    <td><label for="course">Course :</label></td>
                    <td>
                        <select id="course" name="course">
                            <option value="">Select Course</option>
                            <option value="CE">Computer Engineering</option>
                            <option value="IT">Information Technology</option>
                            <option value="EC">Electronics & Communication</option>
                            <option value="ME">Mechanical Engineering</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="message">Message :</label></td>
                    <td>
                        <textarea id="message" name="message" rows="4" cols="40" placeholder="Write your message here..."></textarea>
                    </td>
                </tr>

            </table>

            <br>

            <div align="center">
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </div>

            <br>

        </form>
