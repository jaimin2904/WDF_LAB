    <u><h3>Student Login</h3></u>

         <br></br>
        <br></br>


    <table>

         Name : <input type="text"
       name="username"
       placeholder="Enter your name"
       pattern="[A-Za-z ]+"

       required>
       <br></br>


       Email : <input type="email" placeholder="enter your email" required>
       <br></br>
          

        <label>Password : </label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required
               minlength="8">
        <br><br>
        <br><br>
        

        <input type="submit" value="signup" style="width: 250px;">
        </div>
        </form>
        
        <br></br>
