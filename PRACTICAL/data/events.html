<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Events</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <div id="header">
        <h1 align="center">STUDENTHUB</h1>
    </div>

    <br>

    <div align="center">
        <h2>Events</h2>

        <input
            type="text"
            id="searchEvent"
            placeholder="Search event"
        >

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="Technical">Technical</option>
            <option value="Sports">Sports</option>
            <option value="Cultural">Cultural</option>
            <option value="Workshop">Workshop</option>
            <option value="Academic">Academic</option>
            <option value="Career">Career</option>
        </select>

        <select id="sortEvent">
            <option value="default">Sort By</option>
            <option value="nameAsc">Name A-Z</option>
            <option value="nameDesc">Name Z-A</option>
            <option value="dateAsc">Date Oldest-Newest</option>
            <option value="dateDesc">Date Newest-Oldest</option>
        </select>
    </div>

    <br>

    <div id="loading" align="center">
        Loading events...
    </div>

    <div id="error" align="center"></div>

    <div id="eventsContainer"></div>

    <br>

    <div align="center">
        <button type="button" id="previousBtn">Previous</button>

        <span id="pageNumber">Page 1</span>

        <button type="button" id="nextBtn">Next</button>
    </div>

    <br><br>

    <div align="center">
        <a href="D:\HTML CODES\PRACTICAL\home.HTML">
            <button type="button">BACK</button>
        </a>
    </div>

    <script src="events.js"></script>

</body>
</html>
